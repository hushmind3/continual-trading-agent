[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-trading-agent"
version = "0.1.0"
description = "Continual-learning paper trading agent with cost-aware candidate validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "torch>=2.2", "psutil>=5.9", "requests>=2.31", "keyring>=25.6", "websockets>=12.0", "torchrl==0.14.0", "tensordict==0.14.2", "exchange-calendars==4.13.2"]

[project.optional-dependencies]
teachers = ["stable-baselines3>=2.3", "sb3-contrib>=2.3", "gymnasium>=0.29", "scikit-learn>=1.2", "stockstats>=0.6"]
desktop = ["PySide6>=6.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"frontend/dist" = ["frontend/dist/index.html"]
"frontend/dist/assets" = ["frontend/dist/assets/*"]
