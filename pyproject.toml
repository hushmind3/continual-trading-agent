[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-trading-agent"
version = "0.1.0"
description = "Original FinRL-X, FinRL and SB3 APIs with interchangeable frozen Experts"
requires-python = ">=3.13"
dependencies = ["numpy>=1.26", "pandas>=2.1", "torch>=2.14", "psutil>=5.9", "requests>=2.31", "streamlit==1.45.1", "stable-baselines3==2.9.0", "gymnasium==1.3.0"]

[project.optional-dependencies]
teachers = ["stable-baselines3>=2.3", "sb3-contrib>=2.3", "gymnasium>=0.29", "scikit-learn>=1.2", "stockstats>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]
