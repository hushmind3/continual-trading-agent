[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-trading-agent"
version = "0.1.0"
description = "Project platform with FinRL, SB3, frozen Experts and REA"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "psutil>=5.9", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["backend"]
exclude = ["rea.project_explorer.saved_projects", "rea.project_explorer.saved_projects.*"]
