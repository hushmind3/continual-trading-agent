name: Backend integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend-integrity:
    name: backend-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init modules/ai_agent/choki/backend/engine/upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python modules/ai_agent/choki/backend/engine/prepare.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: modules/ai_agent/choki/backend/engine/upstream/package.json
      - run: pip install numpy==2.2.6 pandas==2.2.3 gymnasium==1.3.0 psutil==7.0.0 requests websockets==10.4 fastapi==0.115.14 -r development/scripts/requirements/verification.txt
      - run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python -m compileall -q -x 'modules/ai_agent/choki/backend/engine/upstream/' backend modules development/scripts
      - run: python -m unittest discover -s development/tests -v
        env:
          PYTHONPATH: backend
  frontend-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init modules/ai_agent/choki/backend/engine/upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python modules/ai_agent/choki/backend/engine/prepare.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: modules/ai_agent/choki/backend/engine/upstream/package.json
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --workspace web --include=dev --no-audit --no-fund
        working-directory: modules/ai_agent/choki/backend/engine/upstream
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:api
        working-directory: frontend

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install fastapi==0.115.14 httpx psutil requests
      - run: python -m unittest discover -s development/tests -p test_project_windows_installer.py -v
        env:
          PYTHONPATH: backend
