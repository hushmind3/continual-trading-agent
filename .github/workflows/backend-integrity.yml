name: Backend integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend-integrity:
    name: backend-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init modules/hermes/backend/engine/upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install numpy==2.2.6 pandas==2.2.3 gymnasium==1.3.0 psutil==7.0.0 requests websockets==10.4 fastapi==0.115.9 -r development/scripts/requirements/verification.txt
      - name: Prepare isolated host and transport-test environments
        run: |
          python -m venv .venv/platform
          .venv/platform/bin/python -m pip install -r development/scripts/requirements/platform.txt
          python -m venv modules/rea/.venv
          modules/rea/.venv/bin/python -m pip install -r modules/rea/requirements.txt
      - run: python -m compileall -q -x 'modules/hermes/backend/engine/upstream/' backend modules development/scripts
      - run: python -m unittest discover -s development/tests -v
        env:
          PYTHONPATH: backend
  frontend-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init modules/hermes/backend/engine/upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python modules/hermes/backend/engine/prepare.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --workspace web --include=dev --no-audit --no-fund
        working-directory: modules/hermes/backend/engine/upstream
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:api
        working-directory: frontend
