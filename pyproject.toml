[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continual-trading-agent"
version = "0.1.0"
description = "Project platform with modular AI agents"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=15,<16", "psutil>=5.9"]

[tool.setuptools.packages.find]
where = ["backend"]
